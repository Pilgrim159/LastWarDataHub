name: Daily Log Rotation

# Triggers: When should this run?
on:
  schedule:
    # Standard nightly run at Midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows you to click "Run workflow" manually on GitHub.com if needed

jobs:
  rotate-logs:
    runs-on: ubuntu-latest
    
    # Granting the bot permission to save files
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Execute Log Rotator
        # This executes your newly upgraded script with the 14-day threshold
        run: python tools/log_rotator.py --days 14

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # This sweeps up both moved active files AND your new history.txt file
          git add logs/
          
          # Commit the changes; '|| exit 0' prevents errors if no logs were old enough to move today
          git commit -m "Automated Action: Archived logs and updated history audit" || exit 0
          
          git push